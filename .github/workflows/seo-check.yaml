name: "SEO Check"
env:
  DOCKER_BUILDKIT: "0"
  COMPOSE_DOCKER_CLI_BUILD: "0"
on:
  push:
  workflow_dispatch:

jobs:
  registry-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check registry reachability
        run: |
          resolvectl status
          sudo apt-get update
          curl https://gitlab.opencode.de -vvv || true
          echo "=== DNS lookup (default resolver) ==="
          dig registry.opencode.de || true
          echo "=== DNS lookup (Google 8.8.8.8) ==="
          dig @8.8.8.8 registry.opencode.de || true
          echo "=== DNSSEC check ==="
          dig @8.8.8.8 registry.opencode.de +dnssec || true
          echo "=== Trace route ==="
          echo "=== curl ==="
          curl -vI https://registry.opencode.de/v2/ 2>&1 || true

  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add Docker apt repo and install Docker 27
        run: |
          set -euxo pipefail
      
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
      
          sudo install -m 0755 -d /etc/apt/keyrings
      
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      
          sudo chmod a+r /etc/apt/keyrings/docker.gpg
      
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
      
          sudo apt-get update
      
          echo "Available Docker CE versions:"
          apt-cache madison docker-ce | head -40
      
          DOCKER_VERSION="$(apt-cache madison docker-ce | awk '{print $3}' | grep '^5:27\.' | head -n1)"
      
          test -n "$DOCKER_VERSION"
      
          echo "Installing Docker version: $DOCKER_VERSION"
      
          sudo systemctl stop docker || true
      
          sudo apt-get install -y --allow-downgrades \
            docker-ce="$DOCKER_VERSION" \
            docker-ce-cli="$DOCKER_VERSION" \
            docker-ce-rootless-extras="$DOCKER_VERSION" \
            containerd.io
      
          sudo systemctl start docker
      
          docker version
      
      - name: Debug exact failing Elasticsearch blob
        run: |
          set -euxo pipefail
      
          REPO="plain/oci/elasticsearch"
          TAG="8.19.9"
          FAILING_BLOB="sha256:fd4aa3667332c2a4837e1b5f395b0555b3c4ec299e38166ae93ee84bad01befa"
      
          TOKEN="$(curl -fsSL \
            "https://gitlab.opencode.de/jwt/auth?service=container_registry&scope=repository:${REPO}:pull" \
            | jq -r .token)"
      
          echo "Fetch failing blob without redirect"
          curl -v \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 120 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry.opencode.de/v2/${REPO}/blobs/${FAILING_BLOB}" \
            -D blob.headers \
            -o blob.body \
            || true
      
          echo "Headers:"
          sed -E 's#(Location: https://[^?]+)\?.*#\1?[REDACTED]#' blob.headers || true
      
          echo "Fetch failing blob with redirect"
          curl -v -L \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 300 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry.opencode.de/v2/${REPO}/blobs/${FAILING_BLOB}" \
            -o /dev/null
      - name: Test failing blob via fixed S3 IPs
        run: |
          set -euxo pipefail
      
          REPO="plain/oci/elasticsearch"
          FAILING_BLOB="sha256:fd4aa3667332c2a4837e1b5f395b0555b3c4ec299e38166ae93ee84bad01befa"
      
          TOKEN="$(curl -fsSL \
            "https://gitlab.opencode.de/jwt/auth?service=container_registry&scope=repository:${REPO}:pull" \
            | jq -r .token)"
      
          curl -sS \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry.opencode.de/v2/${REPO}/blobs/${FAILING_BLOB}" \
            -D blob.headers \
            -o /tmp/blob.redirect \
            || true
      
          URL="$(awk 'tolower($1)=="location:" {print $2}' blob.headers | tr -d '\r')"
      
          echo "Testing 82.22.9.4"
          curl -v -L \
            --http1.1 \
            --resolve s3b.wx-one.com:443:82.22.9.4 \
            --connect-timeout 20 \
            --max-time 300 \
            "$URL" \
            -o /dev/null
      
          echo "Testing 82.22.9.5"
          curl -v -L \
            --http1.1 \
            --resolve s3b.wx-one.com:443:82.22.9.5 \
            --connect-timeout 20 \
            --max-time 300 \
            "$URL" \
            -o /dev/null      
      - name: Enable Docker debug logs
        run: |
          sudo mkdir -p /etc/docker
          echo '{"debug":true,"max-concurrent-downloads":1}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info | grep -i -E 'debug|concurrent' || true

      - name: Debug exact failing config blob
        run: |
          set -euxo pipefail
      
          REPO="open-code/document-writing-tools/seo-check"
          TAG="main-amd64"
      
          TOKEN="$(curl -fsSL \
            "https://gitlab.opencode.de/jwt/auth?service=container_registry&scope=repository:${REPO}:pull" \
            | jq -r .token)"
      
          echo "Fetch manifest"
          curl -v -L \
            --http1.1 \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://registry.opencode.de/v2/${REPO}/manifests/${TAG}" \
            -o manifest.json
      
          cat manifest.json | jq .
      
          CONFIG="$(jq -r '.config.digest' manifest.json)"
          echo "Config digest: ${CONFIG}"
      
          echo "Fetch config blob without following redirect"
          curl -v \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 120 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry.opencode.de/v2/${REPO}/blobs/${CONFIG}" \
            -o /tmp/config.response \
            -D /tmp/config.headers || true
      
          echo "Headers:"
          cat /tmp/config.headers || true
      
          echo "Response:"
          head -c 500 /tmp/config.response || true
      
          echo "Fetch config blob with redirect"
          curl -v -L \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 180 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry.opencode.de/v2/${REPO}/blobs/${CONFIG}" \
            -o config.json
      
          ls -lh config.json
          head -c 300 config.json || true
      - name: Debug exact registry config blob redirect
        run: |
          set -euxo pipefail
      
          REPO="open-code/document-writing-tools/seo-check"
          TAG="main-amd64"
      
          TOKEN="$(curl -fsSL \
            "https://gitlab.opencode.de/jwt/auth?service=container_registry&scope=repository:${REPO}:pull" \
            | jq -r .token)"
      
          echo "Fetching manifest..."
          curl -v \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 120 \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://registry.opencode.de/v2/${REPO}/manifests/${TAG}" \
            -o manifest.json
      
          cat manifest.json | jq .
      
          CONFIG="$(jq -r '.config.digest' manifest.json)"
          echo "Config digest: ${CONFIG}"
      
          echo "Requesting config blob WITHOUT following redirect..."
          curl -v \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 120 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry.opencode.de/v2/${REPO}/blobs/${CONFIG}" \
            -D config.headers \
            -o config.body \
            || true
      
          echo "Headers, with signed query redacted:"
          sed -E 's#(Location: https://[^?]+)\?.*#\1?[REDACTED]#' config.headers || true
      
          echo "Now downloading config blob WITH redirect..."
          curl -v -L \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 180 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry.opencode.de/v2/${REPO}/blobs/${CONFIG}" \
            -o config.json
      
          ls -lh config.json
          head -c 300 config.json || true
      - name: Run SEO-Check
        run: |
            set -x
        
            echo "DNS:"
            getent ahosts registry.opencode.de || true
        
            echo "IPv4 TLS:"
            curl -4 -v --connect-timeout 15 https://registry.opencode.de/v2/ || true
        
            echo "IPv6 TLS:"
            curl -6 -v --connect-timeout 15 https://registry.opencode.de/v2/ || true
        
            echo "TLS handshake timing:"
            time openssl s_client -connect registry.opencode.de:443 -servername registry.opencode.de </dev/null || true

            echo "DNS:"
            getent ahosts s3b.wx-one.com || true


            curl -4 -v --connect-timeout 15 https://oc-registry.s3d.wx1.eu || true
        
            echo "IPv4 TLS:"
            curl -4 -v --connect-timeout 15 https://s3b.wx-one.com/v2/ || true
        
            echo "IPv6 TLS:"
            curl -6 -v --connect-timeout 15 https://s3b.wx-one.com/v2/ || true
        
            echo "TLS handshake timing:"
            time openssl s_client -connect s3b.wx-one.com:443 -servername s3b.wx-one.com </dev/null || true

              
        
            echo "Docker version:"
            docker version

            docker pull registry.opencode.de/plain/oci/elasticsearch:8.19.9
            docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace registry.opencode.de/open-code/document-writing-tools/seo-check:main-amd64
        continue-on-error: true
      
      - name: Show Docker daemon logs
        run: |
          sudo journalctl -u docker --no-pager -n 300
