name: "SEO Check"

on:
  push:
  workflow_dispatch:

jobs:
  registry-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check registry reachability
        run: |
          resolvectl status
          sudo apt-get update
          curl https://gitlab.opencode.de -vvv || true
          echo "=== DNS lookup (default resolver) ==="
          dig registry.opencode.de || true
          echo "=== DNS lookup (Google 8.8.8.8) ==="
          dig @8.8.8.8 registry.opencode.de || true
          echo "=== DNSSEC check ==="
          dig @8.8.8.8 registry.opencode.de +dnssec || true
          echo "=== Trace route ==="
          echo "=== curl ==="
          curl -vI https://registry.opencode.de/v2/ 2>&1 || true

  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable Docker debug logs
        run: |
          sudo mkdir -p /etc/docker
          echo '{"debug":true,"max-concurrent-downloads":1}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info | grep -i -E 'debug|concurrent' || true

      - name: Debug exact failing config blob
        run: |
          set -euxo pipefail
      
          REPO="open-code/document-writing-tools/seo-check"
          TAG="main-amd64"
      
          TOKEN="$(curl -fsSL \
            "https://gitlab.opencode.de/jwt/auth?service=container_registry&scope=repository:${REPO}:pull" \
            | jq -r .token)"
      
          echo "Fetch manifest"
          curl -v -L \
            --http1.1 \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://registry.opencode.de/v2/${REPO}/manifests/${TAG}" \
            -o manifest.json
      
          cat manifest.json | jq .
      
          CONFIG="$(jq -r '.config.digest' manifest.json)"
          echo "Config digest: ${CONFIG}"
      
          echo "Fetch config blob without following redirect"
          curl -v \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 120 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry.opencode.de/v2/${REPO}/blobs/${CONFIG}" \
            -o /tmp/config.response \
            -D /tmp/config.headers || true
      
          echo "Headers:"
          cat /tmp/config.headers || true
      
          echo "Response:"
          head -c 500 /tmp/config.response || true
      
          echo "Fetch config blob with redirect"
          curl -v -L \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 180 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry.opencode.de/v2/${REPO}/blobs/${CONFIG}" \
            -o config.json
      
          ls -lh config.json
          head -c 300 config.json || true
      - name: Run SEO-Check
        run: |
            set -x
        
            echo "DNS:"
            getent ahosts registry.opencode.de || true
        
            echo "IPv4 TLS:"
            curl -4 -v --connect-timeout 15 https://registry.opencode.de/v2/ || true
        
            echo "IPv6 TLS:"
            curl -6 -v --connect-timeout 15 https://registry.opencode.de/v2/ || true
        
            echo "TLS handshake timing:"
            time openssl s_client -connect registry.opencode.de:443 -servername registry.opencode.de </dev/null || true

            echo "DNS:"
            getent ahosts s3b.wx-one.com || true


            curl -4 -v --connect-timeout 15 https://oc-registry.s3d.wx1.eu || true
        
            echo "IPv4 TLS:"
            curl -4 -v --connect-timeout 15 https://s3b.wx-one.com/v2/ || true
        
            echo "IPv6 TLS:"
            curl -6 -v --connect-timeout 15 https://s3b.wx-one.com/v2/ || true
        
            echo "TLS handshake timing:"
            time openssl s_client -connect s3b.wx-one.com:443 -servername s3b.wx-one.com </dev/null || true

              
        
            echo "Docker version:"
            docker version

            docker pull registry.opencode.de/plain/oci/elasticsearch:8.19.9
            docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace registry.opencode.de/open-code/document-writing-tools/seo-check:main-amd64
        continue-on-error: true
      
      - name: Show Docker daemon logs
        run: |
          sudo journalctl -u docker --no-pager -n 300
